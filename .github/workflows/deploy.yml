name: Deploy site to GitHub Pages

# Builds the site with Eleventy on every push to master and publishes it
# to GitHub Pages. No build output is committed to the repo.
#
# One-time setup: in the repo's Settings → Pages, set "Source" to
# "GitHub Actions" (instead of "Deploy from a branch").

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Cloudflare proxies jakeflem.com and caches HTML for 4h (max-age=14400),
      # so a fresh Pages deploy isn't visible until the edge cache is purged.
      # Requires repo secrets CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN
      # (token needs the "Cache Purge" permission). Skipped if they're unset.
      - name: Purge Cloudflare cache
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare secrets not set — skipping cache purge."
            exit 0
          fi
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
